  #       args:
  #         - services/
  #         - libs/
  #         - --fail-under=80
  #         - --exclude
  #         - .*\\.venv.*

  # --- 7. 커밋 및 메시지 (Release) ---
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.15.1
    hooks:
      - id: commitizen
        args: [--allow-abort, --message-length-limit=75]
        stages: [commit-msg]
