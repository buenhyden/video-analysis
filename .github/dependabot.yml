# ============================================================================
# [CUSTOMIZE] Dependabot Configuration
# Enable only ecosystems used by your generated repository.
# ============================================================================
# Dependabot Configuration (2025 Q4)
#
# Automatically keep dependencies up to date.
#
# [CUSTOMIZE] Reviewer Setup
#
# [Guide]
# - Comment out ecosystems you do not use.
# - Choose interval: daily, weekly, or monthly.
# ============================================================================

version: 2
updates:
  # GitHub Actions
  # Updates GitHub Actions dependencies.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      github-actions:
        patterns:
          - '*'

  # npm (Node.js/TypeScript)
  # For Node.js projects. Enable only after package.json and a lockfile exist in the target directory.
