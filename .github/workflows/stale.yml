name: 'Close Stale Issues and PRs'

on:
  schedule:
    - cron: '30 1 * * *'

concurrency:
  group: ${{ github.workflow }}-schedule
  cancel-in-progress: true

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          stale-issue-message: 'This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed if no further activity
            occurs. Thank you for your contributions!'
          stale-pr-message: 'This PR has been automatically marked as stale because it has not
            had recent activity. It will be closed if no further activity
            occurs. Thank you for your contributions!'
          stale-issue-label: 'status: stale'
          stale-pr-label: 'status: stale'
          days-before-stale: 30
          days-before-close: 7
