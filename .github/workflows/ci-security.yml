name: Security CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 12 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Local security and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run local security gate
        run: bash scripts/ci/validate-security.sh

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks.json
          retention-days: 1

  codeql-analyze:
    name: Optional CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        id: codeql_analyze
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        continue-on-error: true
        with:
          category: '/language:actions'

      - name: Enforce CodeQL upload when repository support is required
        if: ${{ always() && steps.codeql_analyze.outcome == 'failure' && vars.CODE_SCANNING_REQUIRED == 'true' }}
        run: |
          echo "CodeQL analyze/upload failed while CODE_SCANNING_REQUIRED=true."
          echo "Enable GitHub code scanning for this repository or fix the underlying CodeQL issue."
          exit 1

      - name: Warn when CodeQL upload is optional for template repositories
        if: ${{ always() && steps.codeql_analyze.outcome == 'failure' && vars.CODE_SCANNING_REQUIRED != 'true' }}
        run: |
          echo "::warning::CodeQL analyze/upload failed, but CODE_SCANNING_REQUIRED is not enabled."
          echo "::warning::For private template repositories, enable GitHub Code Scanning and set CODE_SCANNING_REQUIRED=true when you want this workflow to block merges."
