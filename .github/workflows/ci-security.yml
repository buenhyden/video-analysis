name: Security CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 12 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Local security and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run local security gate
        run: bash scripts/ci/validate-security.sh

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.json
          retention-days: 1

  codeql-analyze:
    name: Optional CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        id: codeql_analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        continue-on-error: true
        with:
          category: '/language:actions'

      - name: Enforce CodeQL upload when repository support is required
        if: ${{ always() && steps.codeql_analyze.outcome == 'failure' && vars.CODE_SCANNING_REQUIRED == 'true' }}
        run: |
          echo "CodeQL analyze/upload failed while CODE_SCANNING_REQUIRED=true."
          echo "Enable GitHub code scanning for this repository or fix the underlying CodeQL issue."
          exit 1

      - name: Warn when CodeQL upload is optional for template repositories
        if: ${{ always() && steps.codeql_analyze.outcome == 'failure' && vars.CODE_SCANNING_REQUIRED != 'true' }}
        run: |
          echo "::warning::CodeQL analyze/upload failed, but CODE_SCANNING_REQUIRED is not enabled."
          echo "::warning::For private template repositories, enable GitHub Code Scanning and set CODE_SCANNING_REQUIRED=true when you want this workflow to block merges."
